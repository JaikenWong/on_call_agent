name: Desktop packages
on:
  workflow_dispatch:
  push:
    branches: [main, codex/personal-desktop]
    tags: ['desktop-v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows-x64
            os: windows-2022
            arch: x64
            spec: Windows
            smoke: dist/OnCallAgent
          - platform: macOS-arm64
            os: macos-15
            arch: arm64
            spec: OnCallAgent
            smoke: dist/OnCallAgent.app/Contents/MacOS
          - platform: macOS-x64
            os: macos-15-intel
            arch: x64
            spec: OnCallAgent
            smoke: dist/OnCallAgent.app/Contents/MacOS
          - platform: Linux-x64
            os: ubuntu-24.04
            arch: x64
            spec: Linux
            smoke: dist/OnCallAgent
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-render-util0
      - name: Build Intel macOS crypto with static OpenSSL
        if: matrix.platform == 'macOS-x64'
        env:
          OPENSSL_STATIC: '1'
        run: python -m pip install --no-cache-dir --no-binary=cryptography cryptography==50.0.2
      - name: Verify Intel macOS crypto linkage
        if: matrix.platform == 'macOS-x64'
        shell: python
        run: |
          import subprocess
          import cryptography.hazmat.bindings._rust as rust
          output = subprocess.check_output(["otool", "-L", rust.__file__], text=True)
          print(output)
          assert "libssl" not in output and "libcrypto" not in output, "OpenSSL must be embedded"
      - name: Install build and test dependencies
        run: python -m pip install -e ".[desktop,bundle,dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build native package
        run: python -m PyInstaller --noconfirm packaging/${{ matrix.spec }}.spec
      - name: Test packaged engine and GUI
        run: python packaging/check_bundle.py ${{ matrix.smoke }}
      - name: Create Windows ZIP
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/OnCallAgent -DestinationPath dist/OnCallAgent-Windows-x64.zip
      - name: Create macOS ZIP
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/OnCallAgent.app dist/OnCallAgent-${{ matrix.platform }}.zip
      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/OnCallAgent-${{ matrix.platform }}.tar.gz OnCallAgent
      - uses: actions/upload-artifact@v4
        with:
          name: OnCallAgent-${{ matrix.platform }}
          path: |
            dist/OnCallAgent-${{ matrix.platform }}.zip
            dist/OnCallAgent-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: OnCallAgent-*
          merge-multiple: true
          path: release-assets
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum OnCallAgent-* > SHA256SUMS.txt
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "飞书值班助手 ${RELEASE_TAG#desktop-} · 桌面试用版" \
              --notes-file ../packaging/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" OnCallAgent-* SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
