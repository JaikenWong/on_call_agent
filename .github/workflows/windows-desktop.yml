name: Windows desktop
on:
  workflow_dispatch:
  push:
    branches: [main, codex/personal-desktop]
    tags: ['desktop-v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build and test dependencies
        run: python -m pip install -e ".[desktop,bundle,dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build Windows executables
        run: python -m PyInstaller --noconfirm packaging/Windows.spec
      - name: Test packaged engine and GUI
        run: python packaging/check_bundle.py dist/OnCallAgent
      - name: Create portable ZIP
        run: Compress-Archive -Path dist/OnCallAgent -DestinationPath dist/OnCallAgent-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OnCallAgent-Windows-x64
          path: dist/OnCallAgent-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OnCallAgent-Windows-x64
          path: release-assets
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum OnCallAgent-Windows-x64.zip > SHA256SUMS.txt
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "飞书值班助手 ${RELEASE_TAG#desktop-} · Windows 试用版" \
              --notes-file ../packaging/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" OnCallAgent-Windows-x64.zip SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
